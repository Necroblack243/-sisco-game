<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SISCO</title>
<meta name="theme-color" content="#2f4bff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SISCO">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
:root{
  box-sizing:border-box;
  --bg:#eef1f8; --panel:#ffffff; --ink:#151a33; --muted:#5d6486; --line:#d5daea;
  --accent:#2f4bff; --accent2:#5b73ff; --accent-ink:#ffffff; --gold:#ffb400; --gold-ink:#3a2a00; --gold-edge:#d99600;
  --cross:#e5384d; --ok:#1f9d55; --cell:#f6f8fd; --cell-done:#e3e6f2; --edge:#c8cfe6; --shadow:0 6px 22px rgba(30,40,100,.10);
  --glow:rgba(47,75,255,.16);
  --font:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0e1226; --panel:#181e3f; --ink:#eef1ff; --muted:#9aa3cc; --line:#2a3364;
    --accent:#6f86ff; --accent2:#8ea0ff; --accent-ink:#0b1030; --gold:#ffc226; --gold-ink:#3a2a00; --gold-edge:#e0a000;
    --cross:#ff6277; --ok:#4cd68a; --cell:#212957; --cell-done:#141937; --edge:#10152f; --shadow:0 6px 22px rgba(0,0,0,.35);
    --glow:rgba(111,134,255,.18);
  }
}
*,*::before,*::after{box-sizing:inherit}
html{min-height:100%;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.4;
  background:radial-gradient(900px 420px at 0% -8%,var(--glow),transparent 70%),radial-gradient(700px 380px at 100% 0%,rgba(255,180,0,.10),transparent 70%),var(--bg);
  background-attachment:fixed}
#app{max-width:560px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top,0px)) 14px calc(96px + env(safe-area-inset-bottom,0px))}
h1{font-size:40px;line-height:1.05;margin:0 0 6px;font-weight:800;letter-spacing:.01em}
h2{font-size:19px;margin:0 0 10px;font-weight:800}
p{margin:0 0 12px;color:var(--muted)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
button{font-family:inherit;font-size:16px;font-weight:800;border:0;border-radius:13px;padding:12px 18px;cursor:pointer;color:var(--accent-ink);
  background:linear-gradient(180deg,var(--accent2),var(--accent));box-shadow:0 3px 0 rgba(0,0,0,.22);transition:transform .08s,box-shadow .08s,opacity .15s}
button:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.22)}
button.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
button.ghost:active:not(:disabled){transform:none;background:var(--cell)}
button.gold{background:linear-gradient(180deg,#ffd04d,var(--gold));color:var(--gold-ink);box-shadow:0 3px 0 var(--gold-edge)}
button.small{padding:7px 11px;font-size:13px;border-radius:10px}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,input:focus-visible,summary:focus-visible,.cell:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
input{font-family:inherit;font-size:16px;padding:13px 12px;border-radius:11px;border:1.5px solid var(--line);background:var(--cell);color:var(--ink);width:100%}
input::placeholder{color:var(--muted);opacity:.7}
label{display:block;font-weight:700;margin:0 0 6px;font-size:14px}
.field{margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.big{width:100%;font-size:18px;padding:15px}
.tag{font-size:13px;color:var(--muted);font-weight:500}
.center{text-align:center}
.err{color:var(--cross);font-weight:700;min-height:20px;margin:0 0 8px;font-size:14px}

/* top bar + logo */
.top{display:flex;align-items:center;justify-content:space-between;margin:2px 0 14px}
.logo{display:flex;gap:4px}
.lt{width:26px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;background:linear-gradient(180deg,#ffd04d,var(--gold));color:var(--gold-ink);box-shadow:0 2px 0 var(--gold-edge)}
.hero{text-align:center;padding:26px 0 12px}
.hero .logo{justify-content:center;gap:8px;margin-bottom:12px}
.hero .lt{width:54px;height:64px;font-size:34px;border-radius:13px;box-shadow:0 4px 0 var(--gold-edge);animation:drop .6s cubic-bezier(.2,1.4,.4,1) both}
.hero .lt:nth-child(2){animation-delay:.07s}.hero .lt:nth-child(3){animation-delay:.14s}.hero .lt:nth-child(4){animation-delay:.21s}.hero .lt:nth-child(5){animation-delay:.28s}
@keyframes drop{from{transform:translateY(-26px) scale(.8);opacity:0}to{transform:none;opacity:1}}
.hero p{font-size:17px;max-width:420px;margin:0 auto}
.tabs{display:flex;gap:6px;background:var(--cell);border-radius:13px;padding:4px;margin-bottom:14px}
.tabs button{flex:1;background:transparent;color:var(--muted);box-shadow:none;padding:10px}
.tabs button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.15)}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;margin:16px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:52px;background:var(--cell);color:var(--ink);border:1.5px solid var(--line);box-shadow:none;padding:10px 12px}
.seg button.on{background:linear-gradient(180deg,var(--accent2),var(--accent));color:var(--accent-ink);border-color:var(--accent)}
.stats{display:flex;gap:8px;margin-top:10px}
.stat{flex:1;background:var(--cell);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:24px;line-height:1.1}
.stat span{font-size:12px;color:var(--muted);font-weight:600}
details{margin:6px 0 14px}
summary{cursor:pointer;font-weight:700;color:var(--muted);padding:6px 2px}
details p{margin:6px 2px 0;font-size:14px}

/* lobby */
.code{font-size:56px;font-weight:800;letter-spacing:.16em;color:var(--accent);line-height:1;margin:2px 0 6px;padding-left:.16em}
.link{display:block;word-break:break-all;background:var(--cell);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:6px 0;font-size:14px;color:var(--ink)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px;background:var(--ok)}
.dot.off{background:var(--line)}
.plist .pl{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.plist .pl:last-child{border-bottom:0}
.badge{font-size:11px;font-weight:800;padding:2px 8px;border-radius:99px;background:var(--cell);border:1px solid var(--line);margin-left:6px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}

/* board */
.board{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:10px 0}
.cell{position:relative;aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:13px;background:var(--cell);border:1.5px solid var(--line);box-shadow:0 3px 0 var(--edge);font-size:clamp(20px,6.6vw,32px);font-weight:800;color:var(--ink);padding:0;user-select:none;-webkit-tap-highlight-color:transparent;transition:transform .08s}
.cell.empty{border-style:dashed;background:transparent;box-shadow:none}
.cell.tap{cursor:pointer}
.cell.tap:hover{border-color:var(--accent)}
.cell.tap:active{transform:translateY(2px);box-shadow:0 1px 0 var(--edge)}
.cell.done{background:var(--cell-done);color:var(--muted);box-shadow:none}
.cell.done::before,.cell.done::after{content:"";position:absolute;left:14%;right:14%;top:50%;height:4px;margin-top:-2px;border-radius:2px;background:var(--cross)}
.cell.done::before{transform:rotate(45deg)}
.cell.done::after{transform:rotate(-45deg)}
.cell.line{background:linear-gradient(180deg,#ffd04d,var(--gold));color:var(--gold-ink);border-color:var(--gold);box-shadow:0 3px 0 var(--gold-edge)}
.cell.line::before,.cell.line::after{background:var(--gold-ink);opacity:.5}
.cell.just{animation:pop .5s ease}
.cell.just::before{animation:draw1 .3s ease-out}
.cell.just::after{animation:draw2 .3s .08s ease-out both}
@keyframes draw1{from{transform:rotate(45deg) scaleX(0)}to{transform:rotate(45deg) scaleX(1)}}
@keyframes draw2{from{transform:rotate(-45deg) scaleX(0)}to{transform:rotate(-45deg) scaleX(1)}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.16)}100%{transform:scale(1)}}

.word{display:flex;gap:5px}
.tile{width:32px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:9px;font-weight:800;font-size:21px;border:1.5px dashed var(--line);color:transparent}
.tile.on{color:var(--gold-ink);background:linear-gradient(180deg,#ffd04d,var(--gold));border:1.5px solid var(--gold);box-shadow:0 2px 0 var(--gold-edge)}
.tile.new{animation:pop .7s ease}
.score{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.score:last-child{border-bottom:0}
.score .nm{font-weight:800}
.score.turn .nm::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--accent);margin-right:8px;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 var(--glow)}50%{box-shadow:0 0 0 6px var(--glow)}}
.banner{background:linear-gradient(180deg,var(--accent2),var(--accent));color:var(--accent-ink);border-radius:15px;padding:12px 14px;margin-bottom:12px;font-weight:800;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.banner small{display:block;font-weight:600;opacity:.95;margin-top:2px}
.banner.gold{background:linear-gradient(180deg,#ffd04d,var(--gold));color:var(--gold-ink);box-shadow:0 3px 0 var(--gold-edge);animation:glow 1.6s infinite}
@keyframes glow{0%,100%{filter:none}50%{filter:brightness(1.07)}}
.banner.quiet{background:var(--panel);color:var(--ink);border:1px solid var(--line);box-shadow:none;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{min-width:30px;text-align:center;padding:4px 7px;border-radius:8px;background:var(--cell);border:1px solid var(--line);font-size:14px;font-weight:800}
.chip.last{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.next{font-size:60px;font-weight:800;line-height:1;color:var(--accent)}
.win .word{justify-content:center;margin:12px 0 4px}
.win .tile{width:50px;height:60px;font-size:32px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:700;max-width:90%;display:none;z-index:20;text-align:center}
#conn{position:sticky;top:0;z-index:5;background:var(--gold);color:var(--gold-ink);font-weight:800;text-align:center;padding:6px;border-radius:10px;margin-bottom:10px;display:none}
.cf{position:fixed;inset:0;pointer-events:none;z-index:30}
.enter>*{animation:fadeUp .42s cubic-bezier(.2,.8,.2,1) both}
.enter>*:nth-child(2){animation-delay:.05s}.enter>*:nth-child(3){animation-delay:.10s}.enter>*:nth-child(4){animation-delay:.15s}.enter>*:nth-child(5){animation-delay:.20s}.enter>*:nth-child(n+6){animation-delay:.25s}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
#ball{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:25}
#ball .ballbody{width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#fff 0,#ffe9a8 18%,var(--gold) 55%,var(--gold-edge) 100%);color:var(--gold-ink);display:none;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 12px 40px rgba(0,0,0,.35)}
#ball.go .ballbody{display:flex;animation:ballshow 1.5s cubic-bezier(.2,1.2,.3,1) both}
#ball small{font-size:12px;font-weight:800;opacity:.85;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#ball b{font-size:64px;line-height:1}
@keyframes ballshow{0%{transform:translateY(-140px) scale(.2) rotate(-200deg);opacity:0}25%{transform:translateY(0) scale(1.1) rotate(0);opacity:1}40%{transform:scale(1)}72%{transform:scale(1);opacity:1}100%{transform:translateY(-50px) scale(.35);opacity:0}}
#lpop{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;z-index:26}
#lpop .row2{display:flex;gap:10px}
#lpop .lp{width:84px;height:100px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:62px;font-weight:800;background:linear-gradient(180deg,#ffd04d,var(--gold));color:var(--gold-ink);box-shadow:0 8px 0 var(--gold-edge),0 20px 50px rgba(0,0,0,.35);animation:lp 1.9s cubic-bezier(.2,1.3,.3,1) both}
#lpop .cap{margin-top:20px;font-weight:800;font-size:20px;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.65);animation:lp 1.9s ease both}
@keyframes lp{0%{transform:scale(0) rotate(-25deg);opacity:0}22%{transform:scale(1.2) rotate(6deg);opacity:1}38%{transform:scale(1) rotate(0)}80%{opacity:1}100%{transform:translateY(-60px) scale(.7);opacity:0}}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:27}
#flash.go{animation:flash .8s ease}
@keyframes flash{0%{opacity:.75}100%{opacity:0}}
.cell.newline{animation:wave .7s ease both}
@keyframes wave{0%{transform:scale(1)}35%{transform:scale(1.2) rotate(-5deg)}70%{transform:scale(.95) rotate(2deg)}100%{transform:scale(1)}}
.board.shuffling .cell{animation:flip .5s ease both;animation-delay:calc(var(--i)*22ms)}
@keyframes flip{0%{transform:rotateY(90deg) scale(.7);opacity:0}100%{transform:none;opacity:1}}
.cell.placed{animation:pop .35s ease}
.panel.myturn{animation:turnglow 1.8s ease-in-out infinite}
@keyframes turnglow{0%,100%{box-shadow:var(--shadow),0 0 0 0 var(--glow)}50%{box-shadow:var(--shadow),0 0 0 7px var(--glow)}}
.win .tile{animation:tilewave 1.6s ease-in-out infinite}
.win .tile:nth-child(2){animation-delay:.12s}.win .tile:nth-child(3){animation-delay:.24s}.win .tile:nth-child(4){animation-delay:.36s}.win .tile:nth-child(5){animation-delay:.48s}
@keyframes tilewave{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.pl.new{animation:slidein .45s ease both}
@keyframes slidein{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
.chat{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.chat[hidden]{display:none}
.chat.inline{margin-bottom:14px}
.chat.sheet{position:fixed;left:8px;right:8px;margin:0 auto;max-width:520px;bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:14;max-height:58vh;box-shadow:0 12px 40px rgba(0,0,0,.35);animation:sheetin .25s ease both}
@keyframes sheetin{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.chead{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--line)}
.cmsgs{padding:10px 12px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;min-height:110px;max-height:230px;flex:1}
.chat.sheet .cmsgs{max-height:none}
.m{max-width:82%;align-self:flex-start;animation:msgin .25s ease both}
.m.me{align-self:flex-end;text-align:right}
.m .who{display:block;font-size:11px;font-weight:800;color:var(--muted);margin:0 6px 2px}
.m .b{display:inline-block;padding:8px 12px;border-radius:15px 15px 15px 4px;background:var(--cell);border:1px solid var(--line);word-break:break-word;font-size:15px;text-align:left}
.m.me .b{background:linear-gradient(180deg,var(--accent2),var(--accent));color:var(--accent-ink);border-color:transparent;border-radius:15px 15px 4px 15px}
@keyframes msgin{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:none}}
.quick{display:flex;gap:6px;overflow-x:auto;padding:4px 12px}
.quick button{padding:5px 11px;font-size:13px;border-radius:99px;background:var(--cell);color:var(--ink);border:1px solid var(--line);box-shadow:none;white-space:nowrap}
#cform{display:flex;gap:8px;padding:8px 12px 12px}
#cform input{padding:11px 12px}
#chatfab{position:fixed;right:12px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:15;width:52px;height:52px;border-radius:50%;padding:0;display:none;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(0,0,0,.3)}
#chatfab svg{width:24px;height:24px}
#chatfab .bd{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;border-radius:10px;background:var(--cross);color:#fff;font-size:12px;font-weight:800;display:none;align-items:center;justify-content:center;padding:0 5px}
#chatfab.bump{animation:pop .5s ease}
.mic.listen{color:var(--accent)}
.chat.inline #cclose{display:none}
@media (pointer:coarse){body.typing #dock,body.typing #chatfab{display:none!important}}
#dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:15;display:none;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:6px;box-shadow:0 8px 28px rgba(0,0,0,.28);max-width:calc(100% - 16px)}
#dock button{padding:9px 14px;font-size:14px;border-radius:99px;white-space:nowrap}
#dock .info{font-size:12px;color:var(--muted);font-weight:700;padding:0 8px;white-space:nowrap;max-width:110px;overflow:hidden;text-overflow:ellipsis}
#dock button.on{background:linear-gradient(180deg,#34d16a,#1fae52);color:#fff;box-shadow:0 2px 0 rgba(0,0,0,.2)}
#dock button.off{background:linear-gradient(180deg,#ff7a8a,var(--cross));color:#fff;box-shadow:0 2px 0 rgba(0,0,0,.2)}
.mic{display:inline-flex;align-items:center;justify-content:center;margin-left:7px;vertical-align:middle;color:var(--muted);border-radius:50%}
.mic svg{width:15px;height:15px}
.mic.off{color:var(--cross)}
.talking .mic{color:var(--ok);animation:pulse 1s infinite}
.talking .nm{color:var(--ok)}
a.btn{display:block;text-align:center;text-decoration:none;font-weight:800;border-radius:13px;padding:12px 18px;font-size:16px;color:#fff;background:linear-gradient(180deg,#34d16a,#1fae52);box-shadow:0 3px 0 rgba(0,0,0,.22)}
a.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.22)}
.lb .pl{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.lb .pl:last-child{border-bottom:0}
.lb .rk{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;background:var(--cell);border:1px solid var(--line);flex:none}
.lb .pl:nth-child(1) .rk{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.lb .pl.me{font-weight:800}
.lb .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{display:inline-block;font-size:12px;font-weight:800;padding:3px 10px;border-radius:99px;background:var(--cell);border:1px solid var(--line);color:var(--ink)}
@media (max-width:400px){.tile{width:28px;height:34px;font-size:18px;border-radius:8px}.word{gap:4px}.hero .lt{width:46px;height:56px;font-size:28px}.code{font-size:48px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="dock" role="group" aria-label="Voice chat"></div>
<div id="chat" class="chat sheet" hidden>
  <div class="chead"><strong>Room chat</strong><button class="ghost small" id="cclose" type="button">Close</button></div>
  <div id="cmsgs" class="cmsgs" aria-live="polite"></div>
  <div class="quick" id="cquick"></div>
  <form id="cform" autocomplete="off"><input id="cin" maxlength="200" placeholder="Type a message" enterkeyhint="send" aria-label="Message"><button type="submit" class="small">Send</button></form>
</div>
<button id="chatfab" aria-label="Open chat" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1.1-4.6A8 8 0 1 1 21 12z"/></svg><span class="bd" id="cbd"></span></button>
<div id="ball" aria-hidden="true"></div><div id="lpop" aria-hidden="true"></div><div id="flash" aria-hidden="true"></div>
<div id="toast" role="alert"></div>
<script>
(function(){
var LETTERS=['S','I','S','C','O'];
var LINES=[];
for(var r=0;r<5;r++)LINES.push([0,1,2,3,4].map(function(c){return r*5+c}));

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function store(k,v){try{if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,typeof v==='string'?v:JSON.stringify(v))}catch(e){}}
function say(t,ms){toast.textContent=t;toast.style.display='block';clearTimeout(say.t);say.t=setTimeout(function(){toast.style.display='none'},ms||3600)}
function shuffled(){var a=[];for(var i=1;i<=25;i++)a.push(i);for(var j=24;j>0;j--){var k=Math.floor(Math.random()*(j+1));var t=a[j];a[j]=a[k];a[k]=t}return a}

function post(path,body){
  return fetch('/api/'+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})})
    .then(function(r){return r.json().then(function(d){if(!r.ok){var er=new Error(d.error||'Something went wrong');er.status=r.status;throw er}return d})});
}
function act(type,extra){
  var b=Object.assign({room:session.room,pid:session.pid,token:session.token,type:type},extra||{});
  return post('action',b).then(function(d){if(polling)pollNow();return d}).catch(function(e){say(e.message)});
}

/* ---------- sound + celebration ---------- */
var ac=null;
function tone(f,d,type,vol,delay){
  if(ui.muted)return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    var o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+(delay||0);
    o.type=type||'sine';o.frequency.value=f;o.connect(g);g.connect(ac.destination);
    g.gain.setValueAtTime(vol||.07,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.start(t);o.stop(t+d+.02);
  }catch(e){}
}
function sfx(prev,cur){
  if(cur.phase==='play'){
    if(prev&&cur.called.length>prev.called.length)tone(420+(cur.last%12)*25,.12,'triangle');
    var f=cur.fresh&&cur.fresh[cur.you];
    if(f&&(!prev||cur.called.length>prev.called.length)){[660,880,1100].forEach(function(n,i){tone(n,.18,'sine',.08,i*.09)})}
    if(cur.turnId===cur.you&&(!prev||prev.turnId!==cur.you||prev.phase!=='play')){
      tone(740,.1,'sine',.08);tone(988,.14,'sine',.08,.1);
      try{if(navigator.vibrate)navigator.vibrate(80)}catch(e){}
    }
  }
}
function celebrate(){
  var won=S.winners.indexOf(S.you)>-1;
  if(won){[523,659,784,1047].forEach(function(n,i){tone(n,.25,'triangle',.09,i*.12)});flash();confetti();setTimeout(confetti,650)}
  else{tone(330,.25,'sine',.06);tone(262,.35,'sine',.06,.2)}
}
function flash(){var f=document.getElementById('flash');f.classList.remove('go');void f.offsetWidth;f.classList.add('go')}
function showBall(n,who){
  var b=document.getElementById('ball');
  b.innerHTML='<div class="ballbody"><small>'+esc(who)+' called</small><b>'+n+'</b></div>';
  b.classList.remove('go');void b.offsetWidth;b.classList.add('go');
}
function showLetters(arr){
  var el=document.getElementById('lpop');
  el.innerHTML='<div class="row2">'+arr.map(function(l,i){return '<div class="lp" style="animation-delay:'+(i*.15)+'s">'+l+'</div>'}).join('')+'</div><div class="cap">'+arr.join(' ')+' unlocked!</div>';
  clearTimeout(showLetters.t);showLetters.t=setTimeout(function(){el.innerHTML=''},2600);
  try{if(navigator.vibrate)navigator.vibrate([60,40,60])}catch(e){}
}
function fx(prev,cur){
  if(!prev||cur.phase==='lobby'||cur.phase==='place')return;
  if(cur.called.length>prev.called.length){
    showBall(cur.last,playerName(cur.lastBy));
    var f=cur.fresh&&cur.fresh[cur.you];
    if(f)setTimeout(function(){showLetters(LETTERS.slice(f.from,f.to))},900);
  }
}
function confetti(){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  var cv=document.createElement('canvas');cv.className='cf';document.body.appendChild(cv);
  var W=cv.width=innerWidth,H=cv.height=innerHeight,x=cv.getContext('2d');
  var cols=['#ffb400','#2f4bff','#e5384d','#1f9d55','#ffffff','#8ea0ff'],ps=[];
  for(var i=0;i<140;i++)ps.push({x:W/2+(Math.random()-.5)*80,y:H*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,s:5+Math.random()*7,c:cols[i%cols.length],r:Math.random()*6,vr:(Math.random()-.5)*.4});
  var start=performance.now();
  (function tick(now){
    var t=now-start;x.clearRect(0,0,W,H);
    ps.forEach(function(p){p.vy+=.3;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/3,p.s,p.s*.6);x.restore()});
    if(t<3800)requestAnimationFrame(tick);else cv.remove();
  })(start);
}

/* ---------- connection ---------- */
var poller=null,gotState=false,fallbackTimer=null,polling=false;
var lastSig='',prevDl=null,animCalled=null,knownIds=null;
function sigOf(d){return JSON.stringify(Object.assign({},d,{chat:0,v:0}))}
function onState(data){
  var prev=S,sg=sigOf(data),chatOnly=!!prev&&sg===lastSig;lastSig=sg;
  S=data;reconnecting=false;gotState=true;
  if(S.phase!=='place')local.board=null;
  if(S.phase!=='play'){prevDl=null;animCalled=null}
  if(chatOnly){updateChat();return}
  sfx(prev,S);
  fx(prev,S);
  render();
  if(S.phase==='end'&&(!prev||prev.phase!=='end'))celebrate();
}
function stopLive(){
  if(es){es.close();es=null}
  clearInterval(poller);poller=null;clearTimeout(fallbackTimer);polling=false;
}
function pollNow(){
  if(!session)return;
  post('state',{room:session.room,pid:session.pid,token:session.token,v:S?S.v:-1}).then(function(d){
    if(!session)return;
    reconnecting=false;showConn();
    if(!d.same)onState(d);
  }).catch(function(e){
    if(e.status===404||e.status===401){leaveLocal('That room is no longer available.')}
    else{reconnecting=true;showConn()}
  });
}
function startPolling(){
  if(polling||!session)return;
  polling=true;
  if(es){es.close();es=null}
  pollNow();poller=setInterval(pollNow,1000);
}
function connect(){
  stopLive();gotState=false;resetChat();lastSig='';knownIds=null;prevDl=null;animCalled=null;
  es=new EventSource('/events?room='+encodeURIComponent(session.room)+'&pid='+session.pid+'&token='+session.token);
  es.addEventListener('state',function(e){onState(JSON.parse(e.data))});
  es.addEventListener('kicked',function(){leaveLocal('The host removed you from the room.')});
  es.onerror=function(){
    if(es&&es.readyState===2){leaveLocal('That room is no longer available.')}
    else{reconnecting=true;showConn()}
  };
  /* some networks and tunnels hold back live updates; if nothing arrives quickly, switch to checking every second */
  fallbackTimer=setTimeout(function(){if(!gotState)startPolling()},2000);
}
function leaveLocal(text){
  stopVoice(true);stopLive();resetChat();lastSig='';knownIds=null;session=null;S=null;store('sisco-session',null);
  if(text)say(text);
  render();
}
function showConn(){var el=document.getElementById('conn');if(el)el.style.display=reconnecting?'block':'none'}

function seg(id,opts,val){
  return '<div class="seg" id="'+id+'">'+opts.map(function(o){return '<button type="button" data-v="'+o[0]+'" class="'+(String(val)===String(o[0])?'on':'')+'" aria-pressed="'+(String(val)===String(o[0]))+'">'+o[1]+'</button>'}).join('')+'</div>';
}
function wireSeg(id,cb){
  var el=document.getElementById(id);if(!el)return;
  el.querySelectorAll('button').forEach(function(b){b.onclick=function(){cb(b.dataset.v)}});

    '<form id="af" novalidate><div class="field"><label for="un">Username</label><input id="un" maxlength="14" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="e.g. chidi_09"></div>'+
    '<div class="field"><label for="pw">Password</label><input id="pw" type="password" maxlength="64" autocomplete="'+(login?'current-password':'new-password')+'" placeholder="'+(login?'Your password':'At least 6 characters')+'"></div>'+
    '<div class="err" id="aerr" role="alert"></div><button class="big" type="submit">'+(login?'Log in':'Create account')+'</button></form>'+

/* ---------- menu ---------- */
function authBody(){return auth.guest?{name:auth.name}:{auth:auth.token,name:auth.name}}
function enter(promise){
  return promise.then(function(d){session={room:d.room,pid:d.pid,token:d.token};store('sisco-session',session);S=null;connect();render()}).catch(function(e){say(e.message)});
}
function renderMenu(){
  var u=ui.me;
  var h=topbar('<button class="ghost small" id="logout">'+(auth.guest?'Exit':'Log out')+'</button>');
  h+='<div class="panel"><div class="tag">'+(auth.guest?'Playing as guest':'Signed in')+'</div><h1 style="font-size:30px;margin:2px 0 0">Hi, '+esc(auth.name)+'</h1>';

  }else if(auth.guest)h+='<p class="tag" style="margin:6px 0 0">Log in to save your wins.</p>';
  h+='</div>';
  h+='<div class="panel"><h2>Play vs computer</h2><label>Opponents</label>'+seg('sbots',[[1,'1'],[2,'2'],[3,'3'],[4,'4']],ui.bots)+
    '<label style="margin-top:12px">Difficulty</label>'+seg('slevel',[['easy','Easy'],['medium','Medium'],['hard','Hard']],ui.level)+

  h+='<div class="panel"><h2>Play with friends</h2><p>Make a room and share the code. Friends can be on any phone or computer.</p><button class="big" id="create">Create room</button>'+
    '<div class="or">or join one</div><div class="row" style="flex-wrap:nowrap"><input id="rc" maxlength="4" autocapitalize="characters" autocomplete="off" aria-label="Room code" placeholder="CODE" value="'+esc(ui.joinCode)+'" style="text-transform:uppercase;letter-spacing:.25em;font-weight:800;text-align:center"><button id="join">Join</button></div></div>';
  h+='<div class="panel lb"><h2>Leaderboard</h2><div id="lb"><p class="tag">Loading...</p></div></div>';
  if(deferred)h+='<button class="ghost big" id="install" style="margin-bottom:10px">Install SISCO as an app</button>';
  h+='<details><summary>How to play</summary><p>Each player arranges the numbers 1 to 25 on a 5 by 5 grid. Players take turns calling a number from their own grid, and it is crossed out for everyone. Every completed row, column or diagonal unlocks the next letter of S, I, S, C, O. First to spell SISCO wins.</p></details>'+
    '<details><summary>Install on your phone or PC</summary><p>Android (Chrome): open the browser menu and tap Install app or Add to Home screen. Windows (Chrome or Edge): click the install icon in the address bar. Installing needs a secure (https) link, which the internet link provides.</p></details>';
  app.innerHTML=h;wireCommon();

  document.getElementById('logout').onclick=function(){
    if(!auth.guest&&auth.token)post('logout',{auth:auth.token}).catch(function(){});
    auth=null;ui.me=null;ui.tab='login';store('sisco-auth',null);render();
  };
  document.getElementById('solo').onclick=function(){enter(post('create',Object.assign(authBody(),{solo:true,bots:ui.bots,level:ui.level})))};
  document.getElementById('create').onclick=function(){enter(post('create',authBody()))};
  document.getElementById('join').onclick=function(){
    var code=document.getElementById('rc').value.trim().toUpperCase();

function loadLeaderboard(){
  post('leaderboard',{}).then(function(d){
    var box=document.getElementById('lb');if(!box)return;
    if(!d.top.length){box.innerHTML='<p class="tag">No wins recorded yet. Log in and win a game to be the first.</p>';return}
    box.innerHTML=d.top.map(function(u,i){
      var me=auth&&!auth.guest&&u.name.toLowerCase()===String(auth.name).toLowerCase();
      return '<div class="pl'+(me?' me':'')+'"><span class="rk">'+(i+1)+'</span><span class="nm">'+esc(u.name)+(me?' (you)':'')+'</span><span class="tag">'+u.wins+' win'+(u.wins===1?'':'s')+' / '+u.played+'</span></div>';
    }).join('');
  }).catch(function(){var box=document.getElementById('lb');if(box)box.innerHTML='<p class="tag">Leaderboard unavailable right now.</p>'});
}
function refreshMe(){
  if(!auth||auth.guest||!auth.token)return;
  post('me',{auth:auth.token}).then(function(d){
    var changed=!ui.me||ui.me.wins!==d.user.wins||ui.me.played!==d.user.played;
    ui.me=d.user;if(changed&&!session&&auth)renderMenu();
  }).catch(function(){auth=null;ui.me=null;store('sisco-auth',null);render()});
}

function playerName(id){var p=S.players.filter(function(x){return x.id===id})[0];return p?p.name:'Someone'}

  });

    h+='<div class="panel"><label>Rounds in this match</label>'+seg('srounds',[[1,'1'],[3,'3'],[5,'5'],[7,'7'],[10,'10']],S.rounds)+

function setInvite(url){
  var a=document.getElementById('wa');if(!a||!S)return;

  var text='Join my SISCO game! Open '+base+'/?room='+S.code+' and use room code '+S.code;

var inviteBase='';
function fillLinks(url){
  var box=document.getElementById('links');if(!box)return;

  function show(urls){box.innerHTML=urls.map(function(u){return '<span class="link">'+esc(u)+'</span>'}).join('')}
  show([url]);
  if(isLocal)fetch('/api/info').then(function(r){return r.json()}).then(function(d){
    if(d.urls&&d.urls.length&&S){inviteBase=d.urls[0];show(d.urls.map(function(u){return u+'/?room='+S.code}));setInvite()}
  }).catch(function(){});

function copyText(t){
  function fb(){var ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');say('Link copied')}catch(e){say('Copy the link shown above')}document.body.removeChild(ta)}
  if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t).then(function(){say('Link copied')},fb);else fb();
}

/* ---------- arranging ---------- */
function renderPlace(){
  var me=S.players.filter(function(p){return p.id===S.you})[0];
  var h=topbar();
  if(me.ready){
    h+='<div class="panel"><h2>Grid locked in'+(S.rounds>1?' <span class="pill" style="vertical-align:middle">Round '+S.round+' of '+S.rounds+'</span>':'')+'</h2><p>Waiting for the others to finish arranging.</p>';
    S.players.forEach(function(p){h+='<div class="score"><span class="nm">'+esc(p.name)+(p.id===S.you?' (you)':'')+'</span><span class="tag">'+(p.ready?'Ready':'Arranging...')+'</span></div>'});
    app.innerHTML=h+'</div>';wireCommon();return;
  }
  if(!local.board)local.board=new Array(25).fill(null);
  var b=local.board;
  var placed=b.filter(function(x){return x!==null}).length,next=placed+1;

function inLineMap(){var m={};LINES.forEach(function(l){if(l.every(function(i){return S.crossed[i]}))l.forEach(function(i){m[i]=1})});return m}

/* ---------- room chat ---------- */
var chat={open:false,seen:0,lastId:0,had:false};
var QUICK=['GG','Nice one','Ready?','Hurry up','Rematch?'];
function resetChat(){chat.open=false;chat.seen=0;chat.lastId=0;chat.had=false;var el=document.getElementById('cmsgs');if(el){el.dataset.key='';el.innerHTML=''}}
function sendChat(t){if(session)act('chat',{text:t})}
function initChat(){

  document.getElementById('cform').onsubmit=function(e){

  };

function placeChat(){
  var ch=document.getElementById('chat'),fab=document.getElementById('chatfab');

  var slot=document.getElementById('chatslot');

  }else{
    if(ch.parentNode!==document.body)document.body.appendChild(ch);
    ch.className='chat sheet';ch.hidden=!chat.open;fab.style.display=chat.open?'none':'flex';
  }
  updateChat();
}
function updateChat(){
  var el=document.getElementById('cmsgs');if(!el||!S)return;
  var list=S.chat||[],lastId=list.length?list[list.length-1].id:0,key=lastId+':'+list.length;
  if(el.dataset.key!==key){
    var near=!el.dataset.key||el.scrollHeight-el.scrollTop-el.clientHeight<90;
    el.innerHTML=list.length?list.map(function(m){
      var me=m.pid===S.you;
      return '<div class="m'+(me?' me':'')+'">'+(me?'':'<span class="who">'+esc(m.name)+'</span>')+'<span class="b">'+esc(m.text)+'</span></div>';
    }).join(''):'<p class="tag center" style="margin:auto">No messages yet. Say hi!</p>';
    el.dataset.key=key;
    if(near)el.scrollTop=el.scrollHeight;
  }
  var visible=(S.phase==='lobby'&&!!document.getElementById('chatslot'))||chat.open;
  if(chat.had&&lastId>chat.lastId){

      tone(880,.06,'sine',.05);
      if(!visible){var f=document.getElementById('chatfab');f.classList.remove('bump');void f.offsetWidth;f.classList.add('bump')}
    }
  }
  chat.lastId=lastId;chat.had=true;

  var unread=list.filter(function(m){return m.id>chat.seen&&m.pid!==S.you}).length;
  var bd=document.getElementById('cbd');bd.style.display=unread?'flex':'none';bd.textContent=unread>9?'9+':unread;

/* ---------- voice chat (peer to peer, like a game lobby) ---------- */
var voice={on:false,listen:false,relay:false,fails:{},muted:false,deaf:false,stream:null,peers:{},timer:null,ice:null,ac:null,level:null,speaking:{},busy:false};
window.siscoVoice=voice;
function micSvg(off){
  return off?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 9v3a3 3 0 0 0 5.1 2.1M15 9.3V5a3 3 0 0 0-5.9-.8"/><path d="M19 11a7 7 0 0 1-1.1 3.8M5 11a7 7 0 0 0 11.2 5.6M12 18v3"/><path d="M3 3l18 18"/></svg>'
    :'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>';
}
var HP='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/></svg>';
function voiceBadge(p){
  if(!p.voice)return '';
  if(p.listen)return '<span class="mic listen" title="Listening only">'+HP+'</span>';
  return '<span class="mic'+(p.muted?' off':'')+'" title="'+(p.muted?'Muted':'In voice chat')+'">'+micSvg(p.muted)+'</span>';
}
function sendSignal(to,data){
  if(!session)return;
  post('signal',{room:session.room,pid:session.pid,token:session.token,to:to,data:data}).catch(function(){});
}
function audioCtx(){
  if(!voice.ac){try{voice.ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
  if(voice.ac&&voice.ac.state==='suspended')voice.ac.resume();
  return voice.ac;
}
function watchLevel(id,stream){
  var ctx=audioCtx();if(!ctx)return null;
  try{
    var src=ctx.createMediaStreamSource(stream),an=ctx.createAnalyser();an.fftSize=512;src.connect(an);
    return {an:an,buf:new Uint8Array(an.fftSize),src:src};
  }catch(e){return null}
}
function levelTick(){
  var ids=Object.keys(voice.level||{});
  ids.forEach(function(id){
    var l=voice.level[id];if(!l)return;
    l.an.getByteTimeDomainData(l.buf);
    var sum=0;for(var i=0;i<l.buf.length;i++){var v=(l.buf[i]-128)/128;sum+=v*v}
    var rms=Math.sqrt(sum/l.buf.length),now=Date.now();
    if(rms>0.02)l.last=now;
    var talking=!!l.last&&now-l.last<450&&!(id===S.you&&voice.muted);
    if(!!voice.speaking[id]!==talking){voice.speaking[id]=talking;applyTalking()}
  });
}
function applyTalking(){
  document.querySelectorAll('[data-pid]').forEach(function(el){
    el.classList.toggle('talking',!!voice.speaking[el.dataset.pid]);
  });
  var names=S?S.players.filter(function(p){return voice.speaking[p.id]&&p.id!==S.you}).map(function(p){return p.name}):[];
  var inf=document.getElementById('vinfo');
  if(inf&&voice.on)inf.textContent=names.length?names[0]+' talking':connectedCount()+' in call';
}
function connectedCount(){
  return Object.keys(voice.peers).filter(function(k){return voice.peers[k].pc.connectionState==='connected'}).length;
}
function peerName(id){var p=S&&S.players.filter(function(x){return x.id===id})[0];return p?p.name:'a player'}
function createPeer(id,initiator){
  var pc=new RTCPeerConnection({iceServers:(voice.ice&&voice.ice.iceServers)||[{urls:'stun:stun.l.google.com:19302'}]});
  var peer={pc:pc,pending:[],audio:null,warned:false};
  voice.peers[id]=peer;
  if(voice.stream)voice.stream.getTracks().forEach(function(t){pc.addTrack(t,voice.stream)});
  else if(initiator)pc.addTransceiver('audio',{direction:'recvonly'});
  pc.onicecandidate=function(e){if(e.candidate)sendSignal(id,{ice:e.candidate})};
  pc.ontrack=function(e){
    var stream=e.streams[0];
    if(!peer.audio){
      var a=document.createElement('audio');a.autoplay=true;a.setAttribute('playsinline','');a.muted=voice.deaf;
      document.body.appendChild(a);peer.audio=a;
    }
    peer.audio.srcObject=stream;
    var p=peer.audio.play();if(p&&p.catch)p.catch(function(){});
    voice.level=voice.level||{};
    if(!voice.level[id])voice.level[id]=watchLevel(id,stream);
  };
  pc.onconnectionstatechange=function(){
    var st=pc.connectionState;
    if(st==='connected')voice.fails[id]=0;
    if(st==='failed'){
      voice.fails[id]=(voice.fails[id]||0)+1;
      if(voice.fails[id]<=2){
        setTimeout(function(){if(voice.on&&voice.peers[id]===peer){closePeer(id);syncPeers()}},1500);
      }else if(!peer.warned){
        peer.warned=true;
        say(voice.relay?'Still could not connect voice with '+peerName(id)+'. Their network may be blocking it.':'Could not connect voice with '+peerName(id)+'. Their network blocks direct audio. The host needs to turn on the relay (see README).',8000);
      }
    }
    updateDock();applyTalking();
  };
  if(initiator){
    pc.createOffer().then(function(o){return pc.setLocalDescription(o)}).then(function(){sendSignal(id,{sdp:pc.localDescription})}).catch(function(){});
  }
  return peer;
}
function closePeer(id){
  var p=voice.peers[id];if(!p)return;
  try{p.pc.close()}catch(e){}
  if(p.audio){p.audio.srcObject=null;p.audio.remove()}
  delete voice.peers[id];
  if(voice.level&&voice.level[id]){try{voice.level[id].src.disconnect()}catch(e){}delete voice.level[id]}
  delete voice.speaking[id];
}
function syncPeers(){
  if(!voice.on||!S)return;
  var want={};
  S.players.forEach(function(p){if(p.id!==S.you&&p.voice&&!p.bot&&!(voice.listen&&p.listen))want[p.id]=true});
  Object.keys(voice.peers).forEach(function(id){if(!want[id])closePeer(id)});
  Object.keys(want).forEach(function(id){
    if(!voice.peers[id])createPeer(id,S.you<id);
  });
}
function handleSignal(m){
  if(!voice.on)return;
  var id=m.from,d=m.data||{};
  if(d.sdp&&d.sdp.type==='offer'){
    var ex=voice.peers[id];
    if(ex&&['failed','closed','disconnected'].indexOf(ex.pc.connectionState)>-1){closePeer(id);ex=null}
    var peer=ex||createPeer(id,false);
    var pc=peer.pc;
    pc.setRemoteDescription(d.sdp).then(function(){
      peer.pending.splice(0).forEach(function(c){pc.addIceCandidate(c).catch(function(){})});
      return pc.createAnswer();
    }).then(function(a){return pc.setLocalDescription(a)}).then(function(){sendSignal(id,{sdp:pc.localDescription})}).catch(function(){});
  }else if(d.sdp&&d.sdp.type==='answer'){
    var p2=voice.peers[id];if(!p2)return;
    p2.pc.setRemoteDescription(d.sdp).then(function(){
      p2.pending.splice(0).forEach(function(c){p2.pc.addIceCandidate(c).catch(function(){})});
    }).catch(function(){});
  }else if(d.ice){
    var p3=voice.peers[id];if(!p3)return;
    if(p3.pc.remoteDescription)p3.pc.addIceCandidate(d.ice).catch(function(){});else p3.pending.push(d.ice);
  }
}
function pollSignals(){
  if(!voice.on||!session)return;
  post('signals',{room:session.room,pid:session.pid,token:session.token}).then(function(d){
    (d.items||[]).forEach(handleSignal);
  }).catch(function(){});
}
function micError(e){
  var n=e&&e.name;
  if(n==='NotAllowedError'||n==='SecurityError')return 'Microphone was not allowed. Close floating bubbles or overlays (Snapchat, Messenger, screen recorders), then tap Join voice again and choose Allow. Or tap Listen only.';
  if(n==='NotFoundError'||n==='OverconstrainedError')return 'No microphone found on this device. You can tap Listen only.';
  if(n==='NotReadableError'||n==='AbortError')return 'Another app is using the microphone. Close it and try again, or tap Listen only.';
  return 'Could not start voice chat. Try again, or tap Listen only.';
}
function joinVoice(listen){
  if(voice.on||voice.busy||!session)return;
  var canMic=navigator.mediaDevices&&navigator.mediaDevices.getUserMedia;
  if(!window.isSecureContext||!window.RTCPeerConnection||(!listen&&!canMic)){
    say('Voice needs the secure https link (not a 192.168 address) and a modern browser.',6000);return;
  }
  voice.busy=true;updateDock();
  var getMic=listen?Promise.resolve(null):navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},video:false});
  getMic.then(function(stream){
    voice.stream=stream;audioCtx();
    return post('ice',{}).catch(function(){return {iceServers:[{urls:'stun:stun.l.google.com:19302'}],relay:false}});
  }).then(function(ice){
    voice.ice=ice;voice.relay=!!ice.relay;voice.on=true;voice.listen=!!listen;voice.muted=false;voice.deaf=false;voice.busy=false;voice.fails={};
    voice.level={};if(!listen)voice.level[S.you]=watchLevel(S.you,voice.stream);
    return act('voice',{on:true,muted:false,listen:!!listen});
  }).then(function(){
    clearInterval(voice.timer);clearInterval(voice.lt);voice.timer=setInterval(pollSignals,500);voice.lt=setInterval(levelTick,120);
    syncPeers();updateDock();
  }).catch(function(e){
    voice.busy=false;
    if(voice.stream){voice.stream.getTracks().forEach(function(t){t.stop()});voice.stream=null}
    say(micError(e),9000);
    updateDock();
  });
}
function stopVoice(tellServer){
  if(!voice.on&&!voice.stream)return;
  clearInterval(voice.timer);clearInterval(voice.lt);voice.timer=null;
  Object.keys(voice.peers).forEach(closePeer);
  if(voice.stream){voice.stream.getTracks().forEach(function(t){t.stop()});voice.stream=null}
  if(voice.level)Object.keys(voice.level).forEach(function(k){try{voice.level[k]&&voice.level[k].src.disconnect()}catch(e){}});
  voice.level=null;voice.speaking={};voice.on=false;voice.listen=false;voice.muted=false;voice.deaf=false;
  if(tellServer&&session)post('action',{room:session.room,pid:session.pid,token:session.token,type:'voice',on:false}).catch(function(){});
  updateDock();applyTalking();
}
function toggleMute(){
  if(!voice.on||!voice.stream)return;
  voice.muted=!voice.muted;
  voice.stream.getAudioTracks().forEach(function(t){t.enabled=!voice.muted});
  if(voice.muted){voice.speaking[S.you]=false;applyTalking()}
  act('voice',{on:true,muted:voice.muted});updateDock();
}
function toggleSpeaker(){
  voice.deaf=!voice.deaf;
  Object.keys(voice.peers).forEach(function(k){if(voice.peers[k].audio)voice.peers[k].audio.muted=voice.deaf});
  updateDock();
}
function updateDock(){
  var d=document.getElementById('dock');if(!d)return;
  if(!session||!S){d.style.display='none';return}
  d.style.display='flex';
  if(!voice.on){
    d.innerHTML='<button class="gold" id="vjoin"'+(voice.busy?' disabled':'')+'>'+(voice.busy?'Starting...':'Join voice chat')+'</button>'+
      '<button class="ghost" id="vlisten"'+(voice.busy?' disabled':'')+'>Listen only</button>';
    document.getElementById('vjoin').onclick=function(){joinVoice(false)};
    document.getElementById('vlisten').onclick=function(){joinVoice(true)};
    return;
  }
  var first=voice.listen?'<button id="vmic" class="ghost">Use mic</button>':'<button id="vmute" class="'+(voice.muted?'off':'on')+'" aria-pressed="'+voice.muted+'">'+(voice.muted?'Mic off':'Mic on')+'</button>';
  d.innerHTML=first+
    '<button id="vspk" class="'+(voice.deaf?'off':'on')+'" aria-pressed="'+voice.deaf+'">'+(voice.deaf?'Speaker off':'Speaker on')+'</button>'+
    '<span class="info" id="vinfo">'+connectedCount()+' in call</span><button class="ghost" id="vleave">Leave</button>';
  var m=document.getElementById('vmute');if(m)m.onclick=toggleMute;
  var u=document.getElementById('vmic');if(u)u.onclick=function(){stopVoice(true);setTimeout(function(){joinVoice(false)},400)};
  document.getElementById('vspk').onclick=toggleSpeaker;
  document.getElementById('vleave').onclick=function(){stopVoice(true)};
}

/* ---------- router ---------- */
var screenKey='';
function render(){
  var ch=document.getElementById('chat'),cin=document.getElementById('cin');
  var hadFocus=document.activeElement===cin;
  if(ch&&ch.parentNode!==document.body){ch.hidden=true;document.body.appendChild(ch)}
  var key=!auth?'welcome':!session?'menu':!S?'wait':S.phase+':'+S.round;
  var changed=key!==screenKey;screenKey=key;
  renderMain();
  if(changed){
    window.scrollTo(0,0);
    app.classList.remove('enter');void app.offsetWidth;app.classList.add('enter');
    clearTimeout(render.t);render.t=setTimeout(function(){app.classList.remove('enter')},800);
  }
  updateDock();applyTalking();if(voice.on)syncPeers();
  placeChat();
  if(hadFocus&&cin)cin.focus({preventScroll:true});
}
function renderMain(){
  document.querySelectorAll('.cf').forEach(function(cf){if(!S||S.phase!=='end')cf.remove()});
  if(!auth){renderWelcome();return}
  if(!session){renderMenu();return}
  if(!S){app.innerHTML=topbar()+'<div class="panel center"><p>Connecting...</p></div>';wireCommon();return}
  if(S.phase==='lobby')renderLobby();
  else if(S.phase==='place')renderPlace();
  else if(S.phase==='play')renderPlay();
  else renderEnd();
}

/* ---------- boot ---------- */
initChat();
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferred=e;if(auth&&!session)renderMenu()});
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){
  window.addEventListener('load',function(){navigator.serviceWorker.register('/sw.js').catch(function(){})});
}
if(session&&auth){
  post('rejoin',session).then(function(){connect();render()}).catch(function(){session=null;store('sisco-session',null);render()});
  render();
}else{session=null;render()}
})();
</script>
